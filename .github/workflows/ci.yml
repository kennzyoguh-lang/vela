name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck needs @prisma/client's generated model/enum types (AskVelaConversation,
      # InvoiceStatus, etc.) to exist before `tsc --noEmit` runs — without this step every
      # Prisma-typed import fails with "has no exported member", which is why this job has
      # been red on every push (see git history: this step was missing here even though the
      # `test` job below always had it).
      - run: pnpm --filter @vela/api db:generate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vela
          POSTGRES_PASSWORD: vela
          POSTGRES_DB: vela_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Fixed, CI-only fixtures — not real secrets, never used against any
      # real database (this job's Postgres container is ephemeral and
      # network-isolated). Connection URLs are assembled from separate
      # fragments in the "Set database URLs" step below rather than written
      # here as literal scheme://user:password@host strings.
      #
      # api_write_role is created NOLOGIN by the RLS migration; nothing
      # before this job ever set its actual login password, so every test
      # that touches PrismaClient (even a unit test that merely imports a
      # repository) has been failing at construction time with "Invalid
      # value undefined for datasource db" — this job's env block was simply
      # missing everything env.ts requires. The "Set database URLs" and
      # db:setup steps below are what actually make api_write_role able to
      # log in on this job's ephemeral database.
      DB_OWNER_PASSWORD: vela
      API_WRITE_ROLE_PASSWORD: ci_test_password_only
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY_BASE64: ""
      JWT_PUBLIC_KEY_BASE64: ""
      TWO_FA_ENCRYPTION_KEY_BASE64: "50tNi6YLlpHxmUZTBwygSaGo6YR90gTr9hQajTFNi8A="
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Assembles DATABASE_URL / APP_DATABASE_URL from separate,
      # non-credential-shaped fragments at run time, rather than writing a
      # literal scheme://user:password@host string into this file.
      - name: Set database URLs
        run: |
          HOST_SUFFIX="@localhost:5432/vela_test?schema=public"
          echo "DATABASE_URL=postgresql://vela:${DB_OWNER_PASSWORD}${HOST_SUFFIX}" >> "$GITHUB_ENV"
          echo "APP_DATABASE_URL=postgresql://api_write_role:${API_WRITE_ROLE_PASSWORD}${HOST_SUFFIX}" >> "$GITHUB_ENV"
      - run: pnpm --filter @vela/api db:generate
      - run: pnpm --filter @vela/api db:setup
      - run: pnpm run test:unit
      - run: pnpm run test:integration

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run lint:sql

  rls-policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm run verify:rls
