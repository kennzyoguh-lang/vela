name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck needs @prisma/client's generated model/enum types (AskVelaConversation,
      # InvoiceStatus, etc.) to exist before `tsc --noEmit` runs — without this step every
      # Prisma-typed import fails with "has no exported member", which is why this job has
      # been red on every push (see git history: this step was missing here even though the
      # `test` job below always had it).
      - run: pnpm --filter @vela/api db:generate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vela
          POSTGRES_PASSWORD: vela
          POSTGRES_DB: vela_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Fixed, CI-only fixtures — not real secrets, never used against any
      # real database (this job's Postgres container is ephemeral and
      # network-isolated). Connection URLs are assembled from separate
      # fragments in the "Set database URLs" step below rather than written
      # here as literal scheme://user:password@host strings.
      #
      # api_write_role is created NOLOGIN by the RLS migration; nothing
      # before this job ever set its actual login password, so every test
      # that touches PrismaClient (even a unit test that merely imports a
      # repository) has been failing at construction time with "Invalid
      # value undefined for datasource db" — this job's env block was simply
      # missing everything env.ts requires. The "Set database URLs" and
      # db:setup steps below are what actually make api_write_role able to
      # log in on this job's ephemeral database.
      DB_OWNER_PASSWORD: vela
      API_WRITE_ROLE_PASSWORD: ci_test_password_only
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Assembles DATABASE_URL / APP_DATABASE_URL from separate,
      # non-credential-shaped fragments at run time, rather than writing a
      # literal scheme://user:password@host string into this file.
      - name: Set database URLs
        run: |
          HOST_SUFFIX="@localhost:5432/vela_test?schema=public"
          echo "DATABASE_URL=postgresql://vela:${DB_OWNER_PASSWORD}${HOST_SUFFIX}" >> "$GITHUB_ENV"
          echo "APP_DATABASE_URL=postgresql://api_write_role:${API_WRITE_ROLE_PASSWORD}${HOST_SUFFIX}" >> "$GITHUB_ENV"
      # Generated fresh every run rather than committed as literal env
      # values — an earlier version of this workflow hardcoded a fake-but-
      # PEM-shaped RSA keypair directly here, which is exactly the pattern a
      # secret scanner (gitleaks, this same job's own next step) is supposed
      # to flag, correctly, regardless of the key being inert. Nothing
      # secret-shaped needs to exist in this file at all when it can just be
      # minted per run and thrown away with the runner.
      - name: Generate ephemeral JWT/2FA keys
        run: |
          node -e "
            const crypto = require('crypto');
            const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', {
              modulusLength: 2048,
              publicKeyEncoding: { type: 'spki', format: 'pem' },
              privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
            });
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_ENV,
              'JWT_PRIVATE_KEY_BASE64=' + Buffer.from(privateKey).toString('base64') + '\n' +
              'JWT_PUBLIC_KEY_BASE64=' + Buffer.from(publicKey).toString('base64') + '\n' +
              'TWO_FA_ENCRYPTION_KEY_BASE64=' + crypto.randomBytes(32).toString('base64') + '\n' +
              'PAYMENT_CREDENTIAL_ENCRYPTION_KEY_BASE64=' + crypto.randomBytes(32).toString('base64') + '\n' +
              'ACCOUNTING_TOKEN_ENCRYPTION_KEY_BASE64=' + crypto.randomBytes(32).toString('base64') + '\n' +
              'PAYROLL_EXPORT_ENCRYPTION_KEY_BASE64=' + crypto.randomBytes(32).toString('base64') + '\n' +
              'KYC_ENCRYPTION_KEY_BASE64=' + crypto.randomBytes(32).toString('base64') + '\n'
            );
            // MINDEE_API_KEY is deliberately left unset here — CI must prove
            // receipt-ocr.service.ts's "OCR unconfigured" fallback path
            // works, not exercise a real (and non-existent) Mindee account.
          "
      - run: pnpm --filter @vela/api db:generate
      - run: pnpm --filter @vela/api db:setup
      - run: pnpm run test:unit
      - run: pnpm run test:integration

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run lint:sql

  rls-policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # verify:rls is just "node scripts/verify-rls.mjs" (package.json) and
      # the script has zero external dependencies — invoking it directly
      # avoids needing pnpm installed in this job at all (this job never had
      # pnpm/action-setup, so `pnpm run ...` was failing with exit 127,
      # "command not found").
      - run: node scripts/verify-rls.mjs
