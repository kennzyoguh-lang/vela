# Local dev parity (Handbook 11.3) — matches the shape of the Supabase-managed
# Postgres and hosted Redis used in staging/production, so "works on my machine"
# gaps don't hide until deploy.
name: vela

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vela
      POSTGRES_PASSWORD: vela
      POSTGRES_DB: vela
    ports:
      - "5432:5432"
    volumes:
      - vela_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vela"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vela_postgres_data:
