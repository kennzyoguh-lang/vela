packages:
  - "apps/*"
  - "packages/*"

# Duplicated from package.json's "pnpm.overrides" (kept for older pnpm --
# CI pins pnpm@9.12.0, which reads overrides from package.json; newer pnpm
# versions read this file instead and ignore the package.json field). Forces
# patched versions of a few high/moderate CVEs in transitive build-tooling
# dependencies (Next's internally-pinned postcss/nanoid, express's
# body-parser->qs) that upstream hasn't bumped its own dependency range for
# yet — see pnpm audit --prod --audit-level=high.
overrides:
  "postcss@<8.5.23": ">=8.5.23"
  "nanoid@<3.3.18": ">=3.3.18"
  "qs@<6.16.0": ">=6.16.0"
  # Dev-tooling only (eslint/commitlint/vite's own transitive deps) — never
  # ships in a built artifact, but still worth patching rather than leaving
  # in the tree unaddressed.
  "esbuild@<0.25.0": ">=0.25.0"
  "vite@<6.4.3": ">=6.4.3"
  "fast-uri@<3.1.6": ">=3.1.6"
  "brace-expansion@<5.0.9": ">=5.0.9"
  "js-yaml@<4.3.2": ">=4.3.2"
